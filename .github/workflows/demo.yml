name: Demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/demo.yml"
      - "docs/demo.tape"
      - "docs/demo/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo.yml"
      - "docs/demo.tape"
      - "docs/demo/**"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render terminal demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CaskaydiaCove Nerd Font
        env:
          NERD_FONTS_VERSION: v3.5.1
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --silent --show-error --location \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/${NERD_FONTS_VERSION}/CascadiaCode.tar.xz" \
            | tar --extract --xz --directory "$HOME/.local/share/fonts"
          fc-cache --force
          case "$(fc-match --format='%{family}' 'CaskaydiaCove NF')" in
            *CaskaydiaCove*) ;;
            *) echo "CaskaydiaCove Nerd Font was not installed" >&2; exit 1 ;;
          esac

      - name: Build disposable demo environment
        if: env.OPENROUTER_API_KEY == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=github_token,env=GITHUB_TOKEN --file docs/demo/Dockerfile --tag dev-cli-demo:local .

      - name: Report unavailable authenticated render
        if: env.OPENROUTER_API_KEY == ''
        run: echo "::notice::OPENROUTER_API_KEY is not configured; Docker build passed and the authenticated tape render was skipped."

      - name: Set up pinned toolchain
        if: env.OPENROUTER_API_KEY != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install demo dependencies
        if: env.OPENROUTER_API_KEY != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg ttyd

      # Temporary evidence for the 1200x900 render cancellation. The sentinel runs in a
      # separate session to distinguish a runner-wide signal from the VHS process tree.
      - name: Start render diagnostics
        if: env.OPENROUTER_API_KEY != ''
        run: |
          cat > "$RUNNER_TEMP/demo-sentinel.sh" <<'EOF'
          #!/usr/bin/env bash
          log="$1"
          trap 'printf "signal=TERM time=%s\n" "$(date -u +%T)" >> "$log"; exit 143' TERM
          trap 'printf "signal=HUP time=%s\n" "$(date -u +%T)" >> "$log"; exit 129' HUP
          trap 'printf "signal=INT time=%s\n" "$(date -u +%T)" >> "$log"; exit 130' INT
          while sleep 1; do :; done
          EOF
          cat > "$RUNNER_TEMP/demo-memory.sh" <<'EOF'
          #!/usr/bin/env bash
          log="$1"
          while sleep 5; do
            available_kb="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
            cgroup_current="$(cat /sys/fs/cgroup/memory.current 2>/dev/null || printf unknown)"
            cgroup_max="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || printf unknown)"
            printf 'time=%s available_kb=%s cgroup_current=%s cgroup_max=%s\n' \
              "$(date -u +%T)" "$available_kb" "$cgroup_current" "$cgroup_max" >> "$log"
          done
          EOF
          : > "$RUNNER_TEMP/demo-signals.log"
          : > "$RUNNER_TEMP/demo-memory.log"
          nohup setsid bash "$RUNNER_TEMP/demo-sentinel.sh" "$RUNNER_TEMP/demo-signals.log" >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/demo-sentinel.pid"
          nohup setsid bash "$RUNNER_TEMP/demo-memory.sh" "$RUNNER_TEMP/demo-memory.log" >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/demo-memory.pid"

      # Same renderer as the release workflow: docs/demo/render.sh runs VHS in its own
      # session, so the teardown signal from the tape's shell cannot kill this step, and it
      # validates that both assets exist and are not empty.
      - name: Render tape against the latest release
        if: env.OPENROUTER_API_KEY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force --tags origin
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [[ "$latest" == v* ]]; then
            export DEV_VERSION="${latest#v}"
          fi
          mise run demo

      - name: Report render diagnostics
        if: always() && env.OPENROUTER_API_KEY != ''
        run: |
          echo '::group::Signal sentinel'
          cat "$RUNNER_TEMP/demo-signals.log" || true
          echo '::endgroup::'
          echo '::group::Memory samples'
          cat "$RUNNER_TEMP/demo-memory.log" || true
          echo '::endgroup::'
          echo '::group::Largest remaining processes'
          ps -eo pid,ppid,sid,rss,comm,args --sort=-rss | sed -n '1,20p'
          echo '::endgroup::'
          kill -KILL "$(cat "$RUNNER_TEMP/demo-sentinel.pid")" "$(cat "$RUNNER_TEMP/demo-memory.pid")" 2>/dev/null || true

      - name: Upload rendered demo
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-cli-demo
          path: |
            docs/assets/dev-cli-demo.gif
            docs/assets/dev-cli-demo.mp4
          if-no-files-found: error
          retention-days: 14
