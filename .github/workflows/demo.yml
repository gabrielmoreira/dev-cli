name: Demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/demo.yml"
      - "docs/demo.tape"
      - "docs/demo/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo.yml"
      - "docs/demo.tape"
      - "docs/demo/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render terminal demo
    runs-on: ubuntu-latest
    # A push waits for its own Release run, which can take most of an hour.
    timeout-minutes: 75
    env:
      OPENROUTER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.OPENROUTER_API_KEY || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CaskaydiaCove Nerd Font
        env:
          NERD_FONTS_VERSION: v3.5.1
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --silent --show-error --location \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/${NERD_FONTS_VERSION}/CascadiaCode.tar.xz" \
            | tar --extract --xz --directory "$HOME/.local/share/fonts"
          fc-cache --force
          case "$(fc-match --format='%{family}' 'CaskaydiaCove NF')" in
            *CaskaydiaCove*) ;;
            *) echo "CaskaydiaCove Nerd Font was not installed" >&2; exit 1 ;;
          esac

      - name: Build disposable demo environment
        if: env.OPENROUTER_API_KEY == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=github_token,env=GITHUB_TOKEN --file docs/demo/Dockerfile --tag dev-cli-demo:local .

      - name: Report unavailable authenticated render
        if: env.OPENROUTER_API_KEY == ''
        run: echo "::notice::OPENROUTER_API_KEY is not configured; Docker build passed and the authenticated tape render was skipped."

      - name: Set up pinned toolchain
        if: env.OPENROUTER_API_KEY != ''
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install demo dependencies
        if: env.OPENROUTER_API_KEY != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg ttyd

      # Same renderer as the release workflow: docs/demo/render.sh runs VHS in its own
      # session, so the teardown signal from the tape's shell cannot kill this step, and it
      # validates that both assets exist and are not empty.
      # The tape describes the CLI this push releases. Reading the latest tag before Release
      # publishes it renders the previous version, so a push waits for its own Release run.
      - name: Wait for the release of this commit
        if: env.OPENROUTER_API_KEY != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
              --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::No Release run found for $GITHUB_SHA."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status

      - name: Render tape against the latest release
        if: env.OPENROUTER_API_KEY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force --tags origin
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [[ "$latest" == v* ]]; then
            export DEV_VERSION="${latest#v}"
          fi
          mise run demo

      - name: Upload rendered demo
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-cli-demo
          path: |
            docs/assets/dev-cli-demo.gif
            docs/assets/dev-cli-demo.mp4
          if-no-files-found: error
          retention-days: 14
