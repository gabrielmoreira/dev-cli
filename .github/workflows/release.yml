name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and release
    if: github.repository == 'gabrielmoreira/dev-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install, verify, and release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise run ci:release
          git fetch --force --tags origin
          release_tag="$(git describe --tags --exact-match "$GITHUB_SHA" 2>/dev/null || true)"
          if [[ "$release_tag" == v* ]]; then
            echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          fi
          # The committed demo is a large binary. Refresh it only when the files
          # that shape it changed since the previous release; a fix to the CLI
          # does not make the recording different enough to justify the bytes.
          demo_changed="false"
          if [[ "$release_tag" == v* ]]; then
            previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep --invert-match -- "^${release_tag}$" | head -n 1 || true)"
            if [[ -z "$previous_tag" ]] || ! git diff --quiet "$previous_tag" "$release_tag" -- docs/demo.tape docs/demo; then
              demo_changed="true"
            fi
          fi
          echo "demo_changed=$demo_changed" >> "$GITHUB_OUTPUT"

      - name: Require demo credentials for a release
        if: steps.release.outputs.demo_changed == 'true' && env.OPENROUTER_API_KEY == ''
        run: |
          echo '::error::OPENROUTER_API_KEY is required to refresh the release demo.'
          exit 1

      - name: Install demo dependencies
        if: steps.release.outputs.demo_changed == 'true'
        env:
          NERD_FONTS_VERSION: v3.5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg ttyd
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --silent --show-error --location \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/${NERD_FONTS_VERSION}/CascadiaCode.tar.xz" \
            | tar --extract --xz --directory "$HOME/.local/share/fonts"
          fc-cache --force

      - name: Render released version demo
        if: steps.release.outputs.demo_changed == 'true'
        env:
          DEV_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run demo

      - name: Commit refreshed demo
        if: steps.release.outputs.demo_changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          demo_output="$RUNNER_TEMP/dev-cli-demo-$GITHUB_RUN_ID.gif"
          cp docs/assets/dev-cli-demo.gif "$demo_output"
          git fetch origin main
          git checkout --force -B demo-refresh origin/main
          cp "$demo_output" docs/assets/dev-cli-demo.gif
          git add docs/assets/dev-cli-demo.gif
          if git diff --cached --quiet; then
            echo 'Rendered demo is unchanged.'
            exit 0
          fi
          sed -E -i "s@(docs/assets/dev-cli-demo\.gif\?v=)[^)]+@\1${RELEASE_TAG}@" README.md
          git add README.md
          git commit --message "docs: refresh terminal demo for ${RELEASE_TAG} [skip ci]"
          git push origin HEAD:main
