[tools]
bun = "1.4.2"
node = "24.21.0"
vhs = "0.11.0"


[tasks."dev"]
run = "bun run dev"
raw_args = true

[tasks."install"]
description = "Install exact dependencies from bun.lock"
run = "bun install --frozen-lockfile --ignore-scripts"

[tasks."ci"]
description = "Install locked dependencies and run hermetic checks"
run = [{ task = "install" }, { task = "verify" }]

[tasks."ci:release"]
description = "Install, verify, and publish the next release"
run = [{ task = "ci" }, { task = "release" }]

[tasks."verify"]
run = "bun run verify"

[tasks."build:release"]
run = "bun run build:release"
raw_args = true

[tasks."verify:install"]
run = "bun scripts/verify-published-release.ts"
raw_args = true

[tasks."release"]
run = "npx --no-install semantic-release"

[tasks."demo"]
description = "Build the disposable environment and render the VHS demo"
run = "bash docs/demo/render.sh"

[tasks."docs:commands"]
description = "Generate the complete CLI command reference"
run = "bun scripts/generate-cli-reference.ts && bun run format -- docs/commands.md"
